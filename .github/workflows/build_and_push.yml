name: Docker image build and publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write # This is required for requesting the JWT

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          repository: vicdanilo/flatirons_test
          ref: main
          token: ${{ secrets.CLONE_TOKEN }}
      -
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::183167903796:role/github-oidc-provider-aws
          aws-region: us-east-1
      -
        name: Login to Amazon public ECR
        id: login-to-ecr
        uses: aws-actions/amazon-ecr-login@v2
      -
        name: Build and push images
        run: |
          echo ${{ steps.login-to-ecr.outputs.registry }}
          echo "Build and push images"
          cd app
          docker build -t ${{ steps.login-to-ecr.outputs.registry }}/app:latest .
          docker push ${{ steps.login-to-ecr.outputs.registry }}/app:latest
