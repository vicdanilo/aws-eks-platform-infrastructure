apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Ensure this service uses the ALB controller
    alb.ingress.kubernetes.io/scheme: internet-facing  #'internet-facing' or 'internal-elb' depending on your use case
    alb.ingress.kubernetes.io/target-type: ip
spec:
  selector:
    app: {{ .Release.Name }} # Matches the app label defined in the Deployment
  ports:
    - port: 80  # Expose your app on port 80
      targetPort: 3000  # This should match the container port
      protocol: TCP
  type: ClusterIP